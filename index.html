<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖片加水印工具</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin:0; padding:20px; background: linear-gradient(135deg, #667eea, #764ba2); color:#333; }
    .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; }
    header { background: #222; color: white; padding: 20px; text-align: center; }
    .main { padding: 25px; display: grid; grid-template-columns: 1fr 420px; gap: 25px; }
    .preview { max-width: 100%; max-height: 550px; border: 3px solid #eee; border-radius: 12px; }
    .controls { background: #f8f9fa; padding: 20px; border-radius: 12px; border: 1px solid #eee; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    input[type="range"] { width: 100%; }
    button { padding: 10px 14px; margin: 5px 3px; border: none; border-radius: 6px; cursor: pointer; }
    .btn-quick { background: #e0e0e0; color: #333; }
    .btn-save { background: #0066ff; color: white; }
    .preset-btn { background: #28a745; color: white; font-size: 14px; }
    footer { text-align: center; padding: 15px; color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <header><h1>📸 圖片加水印工具</h1></header>

    <div class="main">
      <div>
        <input type="file" id="upload" accept="image/*" style="margin-bottom:15px;">
        <img id="preview" class="preview" src="" alt="預覽圖片">
      </div>

      <div class="controls">
        <label>水印文字（支援多行）</label>
        <textarea id="text" rows="3">© 你的名字</textarea>

        <!-- 新增：快速輸入文字 -->
        <label>快速輸入文字</label>
        <div id="quickTextButtons" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;"></div>

        <label>快速加入日期時間</label>
        <div>
          <button class="btn-quick" id="btnYYMMDD">YYMMDD</button>
          <button class="btn-quick" id="btnFullDate">YYMMDD h시</button>
          <button class="btn-quick" id="btnCustom">yyddmm h시</button>
        </div>

        <label>字體大小 <span id="sizeValue">42</span>px</label>
        <input type="range" id="size" min="12" max="150" value="42">

        <label>文字顏色</label><input type="color" id="color" value="#ffffff">

        <label>透明度 <span id="opacityValue">70</span>%</label>
        <input type="range" id="opacity" min="10" max="100" value="70">

        <label>位置模式</label>
        <select id="positionMode">
          <option value="preset">預設位置</option>
          <option value="custom" selected>自定義座標</option>
        </select>

        <div id="presetGroup" style="display:none;">
          <label>預設位置</label>
          <select id="presetPosition">
            <option value="bottom-right">右下角</option>
            <option value="bottom-left">左下角</option>
            <option value="top-right">右上角</option>
            <option value="top-left">左上角</option>
            <option value="center">正中間</option>
          </select>
        </div>

        <div id="customGroup">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div><label>X 座標 (px)</label><input type="number" id="customX" value="100"></div>
            <div><label>Y 座標 (px)</label><input type="number" id="customY" value="100"></div>
          </div>
          <button class="btn-save" id="saveCustomPreset" style="width:100%; margin-top:12px; padding:12px;">💾 儲存目前設定</button>
        </div>

        <div id="savedPresetsArea" style="margin-top:15px;">
          <label>已儲存自定義座標</label>
          <div id="savedPresets" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
        </div>

        <label>旋轉角度 <span id="rotationValue">0</span>°</label>
        <input type="range" id="rotation" min="-45" max="45" value="0">

        <button class="btn-primary" id="applyBtn" style="width:100%;">套用水印（預覽）</button>
        <button class="btn-success" id="downloadBtn" style="width:100%;">💾 下載水印後圖片</button>
      </div>
    </div>
    <footer>純前端工具 • 已優化反應速度</footer>
  </div>

  <script>
    let originalImage = null;
    let currentWatermarked = null;
    let customPresets = JSON.parse(localStorage.getItem('customWatermarkPresets')) || [];
    let quickTexts = ["© 你的名字", "Confidential", "Draft", "2026", "Only For Review"];

    const els = {
      text: document.getElementById('text'),
      size: document.getElementById('size'),
      color: document.getElementById('color'),
      opacity: document.getElementById('opacity'),
      rotation: document.getElementById('rotation'),
      positionMode: document.getElementById('positionMode'),
      customX: document.getElementById('customX'),
      customY: document.getElementById('customY'),
      savedPresets: document.getElementById('savedPresets'),
      quickTextButtons: document.getElementById('quickTextButtons')
    };

    // 渲染快速文字按鈕
    function renderQuickTexts() {
      els.quickTextButtons.innerHTML = '';
      quickTexts.forEach(txt => {
        const btn = document.createElement('button');
        btn.className = 'btn-quick';
        btn.textContent = txt;
        btn.onclick = () => {
          els.text.value = txt;
          applyWatermark();
        };
        els.quickTextButtons.appendChild(btn);
      });
    }

    // 位置模式切換
    els.positionMode.addEventListener('change', () => {
      document.getElementById('presetGroup').style.display = els.positionMode.value === 'preset' ? 'block' : 'none';
      document.getElementById('customGroup').style.display = els.positionMode.value === 'custom' ? 'block' : 'none';
    });

    // 儲存自定義座標
    document.getElementById('saveCustomPreset').addEventListener('click', () => {
      const name = prompt("請輸入自定義預設名稱：", "我的位置 " + (customPresets.length + 1));
      if (!name) return;
      const preset = {
        name: name,
        x: parseInt(els.customX.value) || 100,
        y: parseInt(els.customY.value) || 100,
        text: els.text.value,
        size: els.size.value,
        color: els.color.value,
        opacity: els.opacity.value,
        rotation: els.rotation.value
      };
      customPresets.push(preset);
      localStorage.setItem('customWatermarkPresets', JSON.stringify(customPresets));
      renderSavedPresets();
      alert(`✅ 已儲存：「${name}」`);
    });

    function renderSavedPresets() {
      els.savedPresets.innerHTML = '';
      customPresets.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn';
        btn.textContent = p.name;
        btn.onclick = () => {
          els.customX.value = p.x;
          els.customY.value = p.y;
          els.text.value = p.text || els.text.value;
          els.size.value = p.size || 42;
          els.color.value = p.color || '#ffffff';
          els.opacity.value = p.opacity || 70;
          els.rotation.value = p.rotation || 0;
          applyWatermark();
        };
        els.savedPresets.appendChild(btn);
      });
    }

    // 日期功能
    function getDate() {
      const n = new Date();
      return { yy: String(n.getFullYear()).slice(2), mm: String(n.getMonth()+1).padStart(2,'0'), dd: String(n.getDate()).padStart(2,'0'), hour: String(n.getHours()).padStart(2,'0') };
    }
    document.getElementById('btnYYMMDD').onclick = () => { const d=getDate(); els.text.value += `\n${d.yy}${d.mm}${d.dd}`; applyWatermark(); };
    document.getElementById('btnFullDate').onclick = () => { const d=getDate(); els.text.value += `\n${d.yy}${d.mm}${d.dd} ${d.hour}시`; applyWatermark(); };
    document.getElementById('btnCustom').onclick = () => { const d=getDate(); els.text.value += `\n${d.yy}${d.dd}${d.mm} ${d.hour}시`; applyWatermark(); };

    // 優化：Debounce 防止卡頓
    let timeout;
    function debouncedApply() {
      clearTimeout(timeout);
      timeout = setTimeout(applyWatermark, 150);
    }

    // 水印核心
    document.getElementById('upload').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        document.getElementById('preview').src = ev.target.result;
        originalImage = new Image();
        originalImage.onload = applyWatermark;
        originalImage.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function applyWatermark() {
      if (!originalImage) return;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = originalImage.width;
      canvas.height = originalImage.height;
      ctx.drawImage(originalImage, 0, 0);

      const lines = els.text.value.split('\n').filter(l => l.trim());
      const fontSize = parseInt(els.size.value);
      ctx.font = `bold ${fontSize}px Arial`;
      ctx.fillStyle = els.color.value;
      ctx.globalAlpha = parseInt(els.opacity.value)/100;

      const lineHeight = fontSize * 1.3;
      let x = parseInt(els.customX.value) || 100;
      let y = parseInt(els.customY.value) || 100;

      lines.forEach((line, i) => {
        ctx.fillText(line, x, y + i * lineHeight);
      });

      currentWatermarked = canvas.toDataURL('image/jpeg', 0.92);
      document.getElementById('preview').src = currentWatermarked;
    }

    document.getElementById('applyBtn').addEventListener('click', applyWatermark);
    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (currentWatermarked) {
        const a = document.createElement('a');
        a.href = currentWatermarked;
        a.download = 'watermarked.jpg';
        a.click();
      }
    });

    // 即時更新（已優化）
    document.querySelectorAll('input, select, textarea').forEach(el => {
      el.addEventListener('input', debouncedApply);
    });

    // 初始化
    renderQuickTexts();
    renderSavedPresets();
  </script>
</body>
</html>
