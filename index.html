<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>水印工具 - 新測試版</title>
  <style>
    body { font-family: system-ui; margin: 20px; background: #f0f0f0; }
    .box { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    button { padding: 10px 15px; margin: 5px; }
    .preset-item { padding: 10px; background: #f9f9f9; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="box">
    <h1>圖片加水印 - 測試版</h1>
    <input type="file" id="upload" accept="image/*"><br><br>
    <img id="preview" style="max-width:100%; border:2px solid #ccc;" alt="預覽">

    <h3>水印文字</h3>
    <textarea id="text" rows="3" style="width:100%;">© 測試</textarea>

    <h3>自定義樣式預設</h3>
    <input type="text" id="presetName" placeholder="預設名稱" style="width:200px;">
    <button id="savePreset">儲存目前設定</button>
    <div id="presetList"></div>

    <button id="applyBtn">套用水印</button>
    <button id="downloadBtn">下載</button>
  </div>

  <script>
    let originalImage = null;
    let currentWatermarked = null;
    let presets = JSON.parse(localStorage.getItem('wmPresets')) || [];

    const upload = document.getElementById('upload');
    const preview = document.getElementById('preview');
    const textArea = document.getElementById('text');
    const presetName = document.getElementById('presetName');
    const presetList = document.getElementById('presetList');
    const saveBtn = document.getElementById('savePreset');
    const applyBtn = document.getElementById('applyBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    function renderPresets() {
      presetList.innerHTML = '';
      presets.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'preset-item';
        div.innerHTML = `
          ${p.name}
          <div>
            <button data-i="${i}" class="load">載入</button>
            <button data-i="${i}" class="rename">改名</button>
            <button data-i="${i}" class="delete">刪除</button>
          </div>
        `;
        presetList.appendChild(div);
      });
    }

    saveBtn.addEventListener('click', () => {
      const name = presetName.value.trim() || `預設 ${presets.length+1}`;
      presets.push({
        name: name,
        text: textArea.value
      });
      localStorage.setItem('wmPresets', JSON.stringify(presets));
      renderPresets();
      presetName.value = '';
    });

    presetList.addEventListener('click', e => {
      const i = e.target.dataset.i;
      if (!i) return;
      const idx = parseInt(i);

      if (e.target.classList.contains('load')) {
        textArea.value = presets[idx].text;
        applyWatermark();
      } else if (e.target.classList.contains('rename')) {
        const newName = prompt("新名稱", presets[idx].name);
        if (newName) presets[idx].name = newName;
        localStorage.setItem('wmPresets', JSON.stringify(presets));
        renderPresets();
      } else if (e.target.classList.contains('delete')) {
        if (confirm("確定刪除？")) {
          presets.splice(idx, 1);
          localStorage.setItem('wmPresets', JSON.stringify(presets));
          renderPresets();
        }
      }
    });

    upload.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        preview.src = ev.target.result;
        originalImage = new Image();
        originalImage.onload = applyWatermark;
        originalImage.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function applyWatermark() {
      if (!originalImage) return;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = originalImage.width;
      canvas.height = originalImage.height;
      ctx.drawImage(originalImage, 0, 0);

      const lines = textArea.value.split('\n');
      ctx.font = "bold 50px Arial";
      ctx.fillStyle = "#ffffff";
      ctx.globalAlpha = 0.8;

      lines.forEach((line, i) => {
        ctx.fillText(line, 50, 100 + i*70);
      });

      currentWatermarked = canvas.toDataURL('image/jpeg', 0.9);
      preview.src = currentWatermarked;
    }

    applyBtn.addEventListener('click', applyWatermark);

    downloadBtn.addEventListener('click', () => {
      if (currentWatermarked) {
        const a = document.createElement('a');
        a.href = currentWatermarked;
        a.download = 'watermarked.jpg';
        a.click();
      }
    });

    renderPresets();
  </script>
</body>
</html>
